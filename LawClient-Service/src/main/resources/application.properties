#Basic Config
spring.application.name=LawClient-Service
server.port=8013

#Actuator
management.endpoints.web.exposure.include= health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Adres serwera MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/lawoffice2026
spring.data.mongodb.uuid-representation=standard

#Zipkin
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Circuit Breaker dla lawCaseService
resilience4j.circuitbreaker.instances.lawCaseService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.lawCaseService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.lawCaseService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.lawCaseService.waitDurationInOpenState=5s

# Retry dla lawCaseService
resilience4j.retry.instances.lawCaseService.maxAttempts=3
resilience4j.retry.instances.lawCaseService.waitDuration=2s